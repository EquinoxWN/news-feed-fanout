name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - run: make ci
      - name: Known-vulnerability audit
        run: make audit

  # Fan-out through real Kafka and Valkey (images pinned by digest, bound to localhost only).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f # 4.1.0
        ports: ["127.0.0.1:9092:9092"]
        options: >-
          --memory 1g
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
      valkey:
        image: valkey/valkey@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa # 8.1.4
        ports: ["127.0.0.1:6379:6379"]
        options: >-
          --memory 512m
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      NFF_KAFKA: localhost:9092
      NFF_VALKEY: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Integration test (Kafka consumer groups + Valkey sorted sets)
        run: |
          set -o pipefail
          if make test-integration 2>&1 | tee it.log; then
            echo "::notice title=kafka+valkey integration test::$(grep -m1 'kafka+valkey:' it.log | sed 's/^ *//')"
          else
            echo "::error title=kafka+valkey integration test::$(grep -E -e '--- FAIL|_test\.go:[0-9]+|panic:|internal/(bus|fanout)/[a-z]+\.go:[0-9]+' it.log | head -n 12 | tr '\n' ' ')"
            exit 1
          fi
      - name: Demo against Kafka and Valkey
        run: |
          set -o pipefail
          go run ./cmd/news-feed-fanout demo -users 50000 -posts 500 -celebrities 3 \
            -kafka "$NFF_KAFKA" -valkey "$NFF_VALKEY" -timeout 5m | tee demo.log
          line=$(grep '^verify:' demo.log)
          echo "::notice title=kafka+valkey fan-out::$line"
